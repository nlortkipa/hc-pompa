<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-brand">
                <span class="brand-mark">P</span>
                <span class="auth-logo">POMPA</span>
            </div>
            <p class="auth-subtitle">შეიყვანეთ SMS კოდი</p>
            <p class="auth-info">კოდი გაიგზავნა ნომერზე <br> <strong>{{authService.smsCode()?.userNumber}}</strong></p>
        </div>

        <div class="auth-body">
            <div class="otp-container" [class.otp-error]="showError()">
                <input type="text" maxlength="1" class="otp-input" #otpInput (input)="onOtpInput($event, 0)"
                    (keydown)="onKeyDown($event, 0)" (paste)="onPaste($event)">
                <input type="text" maxlength="1" class="otp-input" #otpInput (input)="onOtpInput($event, 1)"
                    (keydown)="onKeyDown($event, 1)">
                <input type="text" maxlength="1" class="otp-input" #otpInput (input)="onOtpInput($event, 2)"
                    (keydown)="onKeyDown($event, 2)">
                <input type="text" maxlength="1" class="otp-input" #otpInput (input)="onOtpInput($event, 3)"
                    (keydown)="onKeyDown($event, 3)">
            </div>

            <div class="field-error-msg text-center" *ngIf="showError()">
                {{ error() }}
            </div>

            <div class="timer">
                კოდი იწურება: <span>{{ timeLeft() }}</span>
            </div>

            <div class="auth-actions">
                <button class="btn btn-primary w-full" (click)="submit()" [disabled]="isLoading()">
                  <span *ngIf="!isLoading()">შესვლა</span>
                  <span *ngIf="isLoading()">მოწმდება...</span>
                  <span class="button-icon" aria-hidden="true">→</span>
                </button>
                <button class="btn btn-secondary w-full" routerLink="/login">← უკან დაბრუნება</button>
            </div>
        </div>
    </div>
</div>

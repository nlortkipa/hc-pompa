<main class="auth-container">
  <section class="auth-card">
    <header class="auth-header">
      <span class="app-icon-lg" aria-hidden="true"><app-icon name="pump" [size]="42" [stroke]="1.7" /></span>
      <h1>შეიყვანეთ კოდი</h1>
      <p>4-ნიშნა კოდი გაიგზავნა ნომერზე<br><strong>{{ authService.smsCode()?.userNumber }}</strong></p>
    </header>

    <div class="auth-body">
      <div class="otp-container" [class.otp-error]="showError()">
        <input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="4" class="otp-input" #otpInput
          aria-label="ციფრი 1" (input)="onOtpInput($event, 0)" (keydown)="onKeyDown($event, 0)" (paste)="onPaste($event)">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-input" #otpInput aria-label="ციფრი 2"
          (input)="onOtpInput($event, 1)" (keydown)="onKeyDown($event, 1)" (paste)="onPaste($event)">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-input" #otpInput aria-label="ციფრი 3"
          (input)="onOtpInput($event, 2)" (keydown)="onKeyDown($event, 2)" (paste)="onPaste($event)">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-input" #otpInput aria-label="ციფრი 4"
          (input)="onOtpInput($event, 3)" (keydown)="onKeyDown($event, 3)" (paste)="onPaste($event)">
      </div>

      @if (showError()) {
        <div class="field-error-msg otp-msg" role="alert">
          <app-icon name="alert" [size]="13" /> {{ error() }}
        </div>
      }

      <div class="timer" [class.timer--low]="secondsLeft() < 60">
        <app-icon name="clock" [size]="14" />
        კოდი მოქმედებს <strong>{{ timeLeftLabel }}</strong>
      </div>

      <button class="btn btn-primary btn-lg" (click)="submit()" [disabled]="isLoading()">
        @if (isLoading()) {
          <span class="spinner"></span> მოწმდება...
        } @else {
          შესვლა <app-icon name="arrow-right" />
        }
      </button>
      <button class="btn btn-plain" routerLink="/login">
        <app-icon name="arrow-left" /> ნომრის შეცვლა
      </button>
    </div>
  </section>
</main>

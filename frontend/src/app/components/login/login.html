<div class="login-wrap">
    <div class="login-logo">POMPA</div>
    <div class="login-sub">ბეტონის პომპის ოპერატორების სისტემა</div>

    <div>
        <div class="form-group" style="text-align:left">
            <label>ტელეფონის ნომერი</label>
            <input type="tel" id="phone-input" placeholder="5XX XXX XXX" style="font-size:18px;text-align:center"
                [class.field-error]="showError()" [(ngModel)]="number" (ngModelChange)="showError.set(false)">
            <div class="field-error-msg" *ngIf="showError()">
                {{ error() }}
            </div>
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center" (click)="submit()">SMS კოდის გაგზავნა
            →</button>
    </div>
</div>

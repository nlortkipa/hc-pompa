<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-brand">
        <!-- <span class="brand-mark">P</span> -->
        <span class="auth-logo">POMPA</span>
      </div>
      <p class="auth-subtitle">ბეტონის პომპის ოპერატორების სისტემა</p>
    </div>

    <div class="auth-body">
      <div class="form-group">
        <label>ტელეფონის ნომერი</label>
        <div class="input-wrapper">
          <span class="input-prefix">+995</span>
          <input type="tel" placeholder="5XX XXX XXX" [class.field-error]="showError()" [(ngModel)]="number"
            (ngModelChange)="showError.set(false)" (keyup.enter)="submit()">
        </div>
        <div class="field-error-msg" *ngIf="showError()">
          {{ error() }}
        </div>
      </div>

      <button class="btn btn-primary w-full" (click)="submit()" [disabled]="isLoading()">
        <span *ngIf="!isLoading()">SMS კოდის გაგზავნა</span>
        <span *ngIf="isLoading()">გაიგზავნება...</span>
        <span class="button-icon" aria-hidden="true">→</span>
      </button>
    </div>
  </div>
</div>

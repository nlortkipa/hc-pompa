<main class="auth-container">
  <section class="auth-card">
    <div class="auth-panel">
      <div class="auth-mobile-brand">
        <span class="brand-mark">პ</span>
        <span>პომპა</span>
      </div>

      <div class="auth-panel-header">
        <p class="auth-kicker">შესვლა</p>
        <h2>ტელეფონის ნომერი</h2>
      </div>

      <div class="auth-body">
        <div class="form-group">
          <label>ტელეფონის ნომერი</label>
          <div class="input-wrapper">
            <span class="input-prefix">+995</span>
            <input type="tel" inputmode="tel" autocomplete="tel" placeholder="599 123 456"
              [class.field-error]="showError()" [(ngModel)]="number" (ngModelChange)="showError.set(false)"
              (keydown.enter)="submit()">
          </div>
          <div class="field-error-msg" *ngIf="showError()">
            {{ error() }}
          </div>
        </div>

        <button class="btn btn-primary w-full" (click)="submit()" [disabled]="isLoading()">
          <span *ngIf="!isLoading()">სმს კოდის გაგზავნა</span>
          <span *ngIf="isLoading()">იგზავნება...</span>
          <span class="button-icon" aria-hidden="true">→</span>
        </button>
      </div>
    </div>
  </section>
</main>

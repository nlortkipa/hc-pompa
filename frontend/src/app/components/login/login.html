<main class="auth-container">
  <section class="auth-card">
    <header class="auth-header">
      <span class="app-icon-lg" aria-hidden="true"><app-icon name="pump" [size]="42" [stroke]="1.7" /></span>
      <h1>შესვლა {{ appName }}-ში</h1>
      <p>შეიყვანეთ ტელეფონის ნომერი და გამოგიგზავნით სმს კოდს.</p>
    </header>

    <form class="auth-body" (ngSubmit)="submit()" novalidate>
      <div class="form-group">
        <label for="phone">ტელეფონის ნომერი</label>
        <div class="phone-field" [class.field-error]="showError()">
          <span class="phone-prefix">
            <span class="flag" aria-hidden="true">🇬🇪</span>+995
          </span>
          <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="599 12 34 56"
            autofocus [(ngModel)]="number" (ngModelChange)="showError.set(false)">
        </div>
        @if (showError()) {
          <div class="field-error-msg" role="alert">
            <app-icon name="alert" [size]="13" /> {{ error() }}
          </div>
        }
      </div>

      <button class="btn btn-primary btn-lg" type="submit" [disabled]="isLoading()">
        @if (isLoading()) {
          <span class="spinner"></span> იგზავნება...
        } @else {
          კოდის გაგზავნა <app-icon name="arrow-right" />
        }
      </button>
    </form>

    @if (!isNativeApp) {
      <a class="android-download" href="/downloads/android" download>
        <span class="android-icon"><app-icon name="android" [size]="18" /></span>
        <span class="android-copy">
          <strong>პომპა Android-ისთვის</strong>
          <small>ჩამოტვირთეთ მობილური აპლიკაცია</small>
        </span>
        <app-icon name="download" class="android-arrow" />
      </a>
    }
  </section>
</main>

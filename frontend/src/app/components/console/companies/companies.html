<div class="section-title">კომპანიების და მისამართების მართვა</div>

<div class="management-grid">
    <!-- Companies List -->
    <div class="card list-card">
        <div class="card-title">კომპანიები</div>
        
        <div class="form-inline mb-4">
            <input type="text" [(ngModel)]="companyForm.name" (ngModelChange)="filterCompanies()" placeholder="კომპანიის სახელი" class="form-control">
            <button class="btn btn-primary" (click)="saveCompany()" [disabled]="isLoading || !companyForm.name.trim()">
                {{ isEditingCompany ? 'შეცვლა' : 'დამატება' }}
            </button>
            <button *ngIf="isEditingCompany" class="btn btn-secondary compact-btn" (click)="cancelCompanyEdit()">×</button>
        </div>

        <div class="item-list">
            <div *ngFor="let c of filteredCompanies()" 
                 class="item-row" 
                 [class.active]="selectedCompanyId === c.id"
                 (click)="selectCompany(c.id)">
                <span class="item-name">{{c.name}}</span>
                <div class="item-actions">
                    <button class="icon-btn" title="შეცვლა" (click)="$event.stopPropagation(); editCompany(c)">✎</button>
                    <button class="icon-btn text-danger" title="წაშლა" (click)="$event.stopPropagation(); deleteCompany(c.id)">×</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Addresses List -->
    <div class="card list-card" *ngIf="selectedCompanyId">
        <div class="card-title">მისამართები (ლოკაციები)</div>
        
        <div class="form-inline mb-4">
            <input type="text" [(ngModel)]="addressForm.name" (ngModelChange)="filterAddresses()" placeholder="მისამართი" class="form-control">
            <button class="btn btn-primary" (click)="saveAddress()" [disabled]="isLoading || !addressForm.name.trim()">
                {{ isEditingAddress ? 'შეცვლა' : 'დამატება' }}
            </button>
            <button *ngIf="isEditingAddress" class="btn btn-secondary compact-btn" (click)="cancelAddressEdit()">×</button>
        </div>

        <div class="item-list">
            <div *ngFor="let a of filteredAddresses()" class="item-row no-hover">
                <span class="item-name">{{a.name}}</span>
                <div class="item-actions">
                    <button class="icon-btn" title="შეცვლა" (click)="editAddress(a)">✎</button>
                    <button class="icon-btn text-danger" title="წაშლა" (click)="deleteAddress(a.id)">×</button>
                </div>
            </div>
            <div *ngIf="filteredAddresses().length === 0" class="empty-msg">
                მისამართები არ არის დამატებული
            </div>
        </div>
    </div>

    <div class="card empty-card" *ngIf="!selectedCompanyId">
        <div class="empty-state">
            <span class="empty-icon">▦</span>
            <p>აირჩიეთ კომპანია მისამართების სამართავად</p>
        </div>
    </div>
</div>

<div id="topbar">
    <div class="logo">{{appName}}</div>
    <div class="user-chip">
        <span id="user-name">{{profile()?.firstName}} {{profile()?.lastName}}</span>
        <button (click)="logout()" class="btn btn-secondary btn-sm" style="margin-left: 8px; border: none; padding: 4px 8px;">გამოსვლა</button>
    </div>
</div>

<div id="main">
    <div id="sidebar">
        <!-- <div class="nav-item active" data-screen="dashboard" onclick="nav('dashboard')"><span class="nav-icon">📊</span>
            დეშბორდი</div> -->
        <div class="nav-item" routerLink="new" routerLinkActive="active" data-screen="wizard"><span class="nav-icon">➕</span> ახალი
            ჩანაწერი</div>
        <div class="nav-item" routerLink="history" routerLinkActive="active" data-screen="records"><span class="nav-icon">📋</span> ჩანაწერები
        </div>
        <div *ngIf="profile()?.role === 'Admin'" class="nav-item" routerLink="users" routerLinkActive="active"><span class="nav-icon">👥</span> მომხმარებლები
        </div>
        <!-- <div class="nav-item" data-screen="reports" onclick="nav('reports')"><span class="nav-icon">📈</span> რეპორტები
        </div>
        <div class="nav-item" data-screen="admin" onclick="nav('admin')"><span class="nav-icon">⚙️</span> ადმინ</div> -->
    </div>

    <div id="content">
        <router-outlet></router-outlet>
    </div>

    <div id="mobile-nav">
        <div class="mobile-nav-inner">
            <div class="mnav" routerLink="new" routerLinkActive="active">
                <div class="mnav-icon">➕</div>ახალი
            </div>
            <div class="mnav" routerLink="history" routerLinkActive="active">
                <div class="mnav-icon">📋</div>ჩანაწერები
            </div>
            <div *ngIf="profile()?.role === 'Admin'" class="mnav" routerLink="users" routerLinkActive="active">
                <div class="mnav-icon">👥</div>მომხმარებლები
            </div>
        </div>
    </div>
</div>

<div class="search-select" [class.search-select--open]="isOpen">
  <div class="search-select__control">
    <app-icon name="search" [size]="14" class="search-select__icon" />
    <input
      type="search"
      autocomplete="off"
      role="combobox"
      aria-autocomplete="list"
      [attr.aria-expanded]="isOpen"
      [placeholder]="placeholder"
      [value]="query"
      (input)="onInput($event)"
      (focus)="open()"
      (keydown)="onKeydown($event)"
      (keydown.escape)="closeOnEscape()">

    @if (query) {
      <button class="search-select__action search-select__action--clear" type="button" aria-label="გასუფთავება"
        (click)="clear($event)">
        <app-icon name="xmark" [size]="10" [stroke]="2.6" />
      </button>
    } @else {
      <button class="search-select__action" type="button" aria-label="ჩამონათვალის გახსნა" (click)="toggle($event)">
        <app-icon name="chevron-down" [size]="14" />
      </button>
    }
  </div>

  @if (isOpen) {
    <div class="search-select__menu" role="listbox" [ngStyle]="floating ? menuStyle : null">
      @if (showAll) {
        <button class="search-select__option search-select__option--all" type="button" role="option"
          [class.search-select__option--active]="activeIndex === -1" [attr.aria-selected]="value == null"
          (mouseenter)="activeIndex = -1" (click)="clear()">
          <span>{{ allLabel }}</span>
          @if (value == null) { <app-icon name="check" [size]="14" /> }
        </button>
      }

      @for (option of filteredOptions; track option.value; let i = $index) {
        <button class="search-select__option" type="button" role="option"
          [class.search-select__option--active]="activeIndex === i"
          [class.search-select__option--selected]="option.value === value"
          [attr.aria-selected]="option.value === value" (mouseenter)="activeIndex = i" (click)="select(option)">
          <span>{{ option.label }}</span>
          @if (option.value === value) { <app-icon name="check" [size]="14" /> }
        </button>
      }

      @if (filteredOptions.length === 0) {
        <div class="search-select__empty">შედეგი ვერ მოიძებნა</div>
      }
    </div>
  }
</div>

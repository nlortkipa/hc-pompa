<router-outlet></router-outlet>
<app-ui-overlay></app-ui-overlay>

@if (backendAvailability.isUnavailable()) {
  <div class="service-unavailable" role="alert" aria-live="assertive">
    <section class="service-unavailable__card">
      <div class="service-unavailable__icon" aria-hidden="true">
        <app-icon name="wifi-off" [size]="28" [stroke]="1.6" />
      </div>

      <h1>სერვერთან დაკავშირება ვერ მოხერხდა</h1>
      <p class="service-unavailable__message">
        სერვერი დროებით მიუწვდომელია. კავშირი ავტომატურად აღდგება, როგორც კი სერვერი კვლავ უპასუხებს.
      </p>

      <button class="btn btn-primary btn-lg" type="button" [disabled]="backendAvailability.isChecking()"
        (click)="backendAvailability.retry()">
        @if (backendAvailability.isChecking()) {
          <span class="spinner"></span> მოწმდება...
        } @else {
          <app-icon name="refresh" /> თავიდან ცდა
        }
      </button>
    </section>
  </div>
}
